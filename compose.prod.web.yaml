# ============================================================================
#  เครื่อง production ฝั่ง WEB — มีแค่ nginx + app (ไม่มีฐานข้อมูล)
#     docker compose -f compose.yaml -f compose.prod.web.yaml up -d --build
#  ต้องมีไฟล์ .env อยู่ข้าง ๆ (คัดลอกจาก env/prod.web.env.example)
#  ตัวแปรที่เขียน ${VAR:?...} คือบังคับ ถ้าไม่ใส่ compose จะไม่ยอมสตาร์ตเลย
#  ดีกว่าปล่อยให้ขึ้นแล้วไปพังตอนมีผู้ใช้จริง
# ============================================================================
services:
  app:
    build:
      context: ./app
      target: prod
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:?ต้องกำหนด DB_HOST = IP ภายในของเครื่องฐานข้อมูล}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:?ต้องกำหนด POSTGRES_DB}
      DB_USER: ${POSTGRES_USER:?ต้องกำหนด POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?ต้องกำหนด POSTGRES_PASSWORD ให้ตรงกับเครื่องฐานข้อมูล}
      DB_SSLMODE: ${DB_SSLMODE:-require}   # วิ่งข้ามเครื่อง ต้องเข้ารหัสเสมอ
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    restart: always
    # ห้าม map port ของ app ออกนอกเครื่อง ให้เข้าผ่าน nginx ทางเดียว
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: always
    logging: *logging
