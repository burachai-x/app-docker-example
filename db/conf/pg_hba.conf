# ============================================================================
#  pg_hba.conf สำหรับเครื่องฐานข้อมูล production
#  PostgreSQL อ่านจากบนลงล่าง แล้วใช้ "บรรทัดแรกที่ตรง" เท่านั้น ลำดับจึงสำคัญ
#
#  ปรับก่อนใช้งานจริง: เปลี่ยน 0.0.0.0/0 ในบรรทัด hostssl เป็น IP ของเครื่อง web
#  เช่น  hostssl  all  all  10.0.0.10/32  scram-sha-256
# ============================================================================

# TYPE       DATABASE  USER  ADDRESS        METHOD

# ใช้ตอน entrypoint สร้างฐานข้อมูลครั้งแรก (ผ่าน unix socket ในคอนเทนเนอร์)
local        all       all                  trust

# healthcheck และ psql ที่รันในคอนเทนเนอร์เดียวกัน
host         all       all   127.0.0.1/32   scram-sha-256
host         all       all   ::1/128        scram-sha-256

# เครื่อง web ต่อเข้ามา — ต้องผ่าน TLS และใช้รหัสผ่านแบบ scram เท่านั้น
hostssl      all       all   0.0.0.0/0      scram-sha-256

# ใครก็ตามที่ต่อมาแบบไม่เข้ารหัส ตัดทิ้ง ไม่ต้องให้โอกาสลองรหัสผ่าน
hostnossl    all       all   0.0.0.0/0      reject
