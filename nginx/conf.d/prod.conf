# ---------- nginx สำหรับเครื่อง production (เครื่อง web) ----------
# ถ้าจะเปิด HTTPS ให้ดู nginx/conf.d/prod-tls.conf.example

resolver 127.0.0.11 valid=10s ipv6=off;

log_format prod_fmt '$remote_addr - "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" xff="$http_x_forwarded_for" '
                    'rt=${request_time}s urt=${upstream_response_time}s';
access_log /var/log/nginx/access.log prod_fmt;

server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ให้ load balancer / uptime check ยิงได้โดยไม่ต้องรบกวน app
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ไฟล์ static ที่มีลายนิ้วมือในชื่อ cache ได้ยาว
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ ^/(api|healthz|readyz) {
        set $upstream_app app:3000;
        proxy_pass http://$upstream_app$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # ถ้า app ตัวหนึ่งล้ม ให้ลองตัวถัดไปแทนที่จะคืน 502 ทันที
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
