# ---------- nginx สำหรับเครื่องเดฟ ----------
# ต่างจาก prod แค่ 3 เรื่อง: ไม่ cache, โชว์ error ตรง ๆ, timeout ยาวเพื่อให้ debugger ไม่หลุด

# ใช้ DNS ของ docker แทนการ resolve ตอนสตาร์ต ทำให้ nginx ขึ้นได้แม้ app ยังไม่พร้อม
# (ถ้าเขียน proxy_pass http://app:3000; ตรง ๆ แล้ว app ยังไม่ขึ้น nginx จะดับด้วย "host not found in upstream")
resolver 127.0.0.11 valid=10s ipv6=off;

log_format dev_fmt '$remote_addr "$request" $status ${request_time}s -> $upstream_addr ${upstream_response_time}s';
access_log /var/log/nginx/access.log dev_fmt;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ไฟล์ static ระหว่างพัฒนา ห้าม cache ไม่งั้นแก้ CSS แล้วไม่เห็นผล
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|healthz|readyz) {
        set $upstream_app app:3000;
        proxy_pass http://$upstream_app$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    600s;   # ยาวไว้ เผื่อหยุดที่ breakpoint
        proxy_send_timeout    600s;
    }
}
