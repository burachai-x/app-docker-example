# ============================================================================
#  เครื่อง production ฝั่ง DATABASE — รันแยกอีกเครื่อง ไม่ใช้ compose.yaml
#     docker compose -f compose.prod.db.yaml up -d
#  ต้องมีไฟล์ .env (คัดลอกจาก env/prod.db.env.example)
#  และต้องมีใบรับรองใน db/certs/ (สร้างด้วย deploy/gen-db-certs.sh)
# ============================================================================
name: app-docker-example-db

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?ต้องกำหนด POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?ต้องกำหนด POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องกำหนด POSTGRES_PASSWORD}
      # ปรับตาม RAM ของเครื่องฐานข้อมูล
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---data-checksums}
    ports:
      # สำคัญ: ผูกกับ IP วงภายในเท่านั้น ห้ามใช้ 0.0.0.0 เพราะจะเปิดฐานข้อมูลออกอินเทอร์เน็ต
      - "${DB_BIND_ADDRESS:?ต้องกำหนด DB_BIND_ADDRESS = IP วงภายในของเครื่องนี้}:${DB_PORT:-5432}:5432"
    volumes:
      # postgres 18 ขึ้นไป ต้อง mount ที่ /var/lib/postgresql (ไม่ใช่ .../data) ดูคอมเมนต์ใน compose.dev.yaml
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/conf/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db/certs:/certs:ro
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /certs/server.key ]; then
          echo "[db] ไม่พบ /certs/server.key — รัน deploy/gen-db-certs.sh ก่อน deploy" >&2
          exit 1
        fi
        # postgres ปฏิเสธคีย์ที่สิทธิ์กว้างเกินไป จึงต้องคัดลอกเข้ามาแล้วตั้ง 600 ให้ user postgres
        mkdir -p /etc/postgresql/tls
        install -m 600 -o postgres -g postgres /certs/server.key /etc/postgresql/tls/server.key
        install -m 644 -o postgres -g postgres /certs/server.crt /etc/postgresql/tls/server.crt
        exec docker-entrypoint.sh postgres \
          -c hba_file=/etc/postgresql/pg_hba.conf \
          -c ssl=on \
          -c ssl_cert_file=/etc/postgresql/tls/server.crt \
          -c ssl_key_file=/etc/postgresql/tls/server.key \
          -c max_connections=${PG_MAX_CONNECTIONS:-100} \
          -c shared_buffers=${PG_SHARED_BUFFERS:-256MB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    stop_grace_period: 1m     # ให้เวลา postgres เขียน checkpoint ก่อนถูกฆ่า
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # สำรองข้อมูลอัตโนมัติ — ทีมมักลืมทำ จึงใส่มาให้ตั้งแต่ต้น
  backup:
    image: postgres:18-alpine
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./db/backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        echo "[backup] เริ่มทำงาน ทุก $${BACKUP_INTERVAL_SECONDS} วินาที เก็บย้อนหลัง $${BACKUP_KEEP_DAYS} วัน"
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          out="/backups/$${PGDATABASE}-$${ts}.dump"
          if pg_dump -Fc -f "$$out"; then
            echo "[backup] สำเร็จ: $$out ($$(du -h "$$out" | cut -f1))"
          else
            echo "[backup] ล้มเหลวเมื่อ $$ts" >&2
          fi
          find /backups -name '*.dump' -type f -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    depends_on:
      db:
        condition: service_healthy
    restart: always
    logging: *logging

volumes:
  pgdata:
